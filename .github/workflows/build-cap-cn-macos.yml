name: Build Cap Chinese macOS

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Default Cap Web server URL
        required: true
        default: https://cap.so

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-darwin

      - name: Configure Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          target: aarch64-apple-darwin

      - name: Install JavaScript dependencies
        uses: ./.github/actions/setup-js

      - name: Verify Chinese catalog
        run: pnpm desktop:i18n:check

      - name: Create build environment
        shell: bash
        env:
          CAP_CN_SERVER_URL: ${{ inputs.server_url }}
        run: |
          {
            echo "VITE_ENVIRONMENT=production"
            echo "NEXT_PUBLIC_WEB_URL=$CAP_CN_SERVER_URL"
            echo "NEXTAUTH_URL=$CAP_CN_SERVER_URL"
            echo "VITE_SERVER_URL=$CAP_CN_SERVER_URL"
            echo "RUST_TARGET_TRIPLE=aarch64-apple-darwin"
          } >> .env

      - name: Prepare Cap workspace
        run: pnpm -w cap-setup
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin

      - name: Build desktop sidecars
        shell: bash
        run: ./scripts/build-desktop-binaries.sh aarch64-apple-darwin

      - name: Build unsigned DMG
        working-directory: apps/desktop
        run: pnpm build:tauri --target aarch64-apple-darwin --config src-tauri/tauri.prod.conf.json --config src-tauri/tauri.cn.conf.json --bundles dmg
        env:
          CI: false
          RUST_TARGET_TRIPLE: aarch64-apple-darwin

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: cap-cn-macos-arm64
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
